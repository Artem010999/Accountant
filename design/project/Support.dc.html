<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Буха — поддержка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#C2410C}a:hover{color:#9A3412}
input:focus,select:focus{outline: 3px solid #FFB38A; outline-offset: 1px}
</style>
</helmet>
<div style="font-family: Onest, Inter, system-ui, sans-serif; color: #17171C; background: #FFFFFF; min-height: 100vh">

<header style="border-bottom: 1px solid #E4E4E7">
  <div style="max-width: 1280px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none" aria-label="Буха — на главную">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#FF6B1A"></rect><path d="M7 7 L12 11 M33 7 L28 11" stroke="#17171C" stroke-width="2.5" stroke-linecap="round"></path><circle cx="13.5" cy="18" r="7" fill="#FFFFFF"></circle><circle cx="26.5" cy="18" r="7" fill="#FFFFFF"></circle><circle cx="15" cy="17" r="3" fill="#17171C"></circle><circle cx="28" cy="17" r="3" fill="#17171C"></circle><path d="M17.5 27 L20 31 L22.5 27 Z" fill="#17171C"></path></svg>
      <span style="font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: #17171C">Буха</span>
    </a>
  </div>
</header>

<main style="max-width: 720px; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.02em">Написать в поддержку</h1>
    <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #52525B">Ответим на почту в течение рабочего дня. Не присылайте пароли и данные карт.</p>
  </div>
  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form style="display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sup-email" style="font-size: 15px; font-weight: 600">Электронная почта<span aria-hidden="true" style="color: #B91C1C; font-weight: 700"> *</span></label>
        <input id="sup-email" type="email" required="" aria-required="true" value="ivan@university.ru" autocomplete="email" style="min-height: 56px; padding: 0 18px; border: 1px solid #D4D4D8; border-radius: 16px; font: 400 17px Onest, system-ui, sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sup-name" style="font-size: 15px; font-weight: 600">Имя<span aria-hidden="true" style="color: #B91C1C; font-weight: 700"> *</span></label>
        <input id="sup-name" type="text" required="" aria-required="true" value="Иван" autocomplete="given-name" style="min-height: 56px; padding: 0 18px; border: 1px solid #D4D4D8; border-radius: 16px; font: 400 17px Onest, system-ui, sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sup-msg" style="font-size: 15px; font-weight: 600">Сообщение<span aria-hidden="true" style="color: #B91C1C; font-weight: 700"> *</span></label>
        <textarea id="sup-msg" rows="6" required="" aria-required="true" maxlength="2000" onChange="{{ onMsg }}" placeholder="Опишите проблему: что делали и что увидели" style="padding: 16px 18px; border: 1px solid #D4D4D8; border-radius: 18px; font: 400 17px/1.55 Onest, system-ui, sans-serif; resize: vertical"></textarea>
        <span style="align-self: flex-end; font-size: 14px; color: #71717A">{{ count }} из 2000</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
        <span style="font-size: 14px; color: #71717A"><span style="color: #B91C1C; font-weight: 700">*</span> — обязательные поля</span>
        <button type="button" onClick="{{ send }}" style="min-height: 60px; padding: 0 36px; border: 0; background: #FF6B1A; border-radius: 999px; font: 700 18px Onest, system-ui, sans-serif; color: #17171C; cursor: pointer">Отправить</button>
      </div>
    </form>
  </sc-if>
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="background: #F0FDF4; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 24px; font-weight: 700; color: #166534">Сообщение отправлено</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F3F46">Ответ придёт на ivan@university.ru.</p>
      <a href="Passport.dc.html" style="align-self: flex-start; font-size: 16px; font-weight: 600">Вернуться в кабинет</a>
    </div>
  </sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false, len: 0 }; }
  renderVals() {
    return {
      sent: this.state.sent, notSent: !this.state.sent,
      count: this.state.len,
      onMsg: e => this.setState({ len: e.target.value.length }),
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
