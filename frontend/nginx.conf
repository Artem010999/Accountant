server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Безопасность (локально и на сервере; TLS — на внешнем балансировщике/certbot, см. G5.3).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Одна origin: API доступен по тем же адресам, что и сайт (CORS не нужен).
  location /pipeline {
    proxy_pass http://pipeline:8080;
    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /support {
    proxy_pass http://pipeline:8080;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
  }

  # SPA: все маршруты отдают index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Статика с хешами — кэшировать долго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
